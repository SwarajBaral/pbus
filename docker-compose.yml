services:
  api:
    build: .
    image: paribus-bulk:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PARIBUS_DIRECTORY_URL: ${PARIBUS_DIRECTORY_URL:-https://hospital-directory.onrender.com}
      PARIBUS_CONCURRENCY: ${PARIBUS_CONCURRENCY:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
